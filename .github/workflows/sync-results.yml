name: Sync Match Results

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Skip when secret is missing
        if: ${{ secrets.FOOTBALL_DATA_API_TOKEN == '' }}
        run: echo "FOOTBALL_DATA_API_TOKEN ontbreekt. Zet deze secret in je repo instellingen om auto-sync te activeren."

      - name: Update results from football-data.org
        if: ${{ secrets.FOOTBALL_DATA_API_TOKEN != '' }}
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          FOOTBALL_COMPETITION_CODE: WC
          FOOTBALL_SEASON: "2026"
          POULE_DATA_FILE: public/wedstrijden-data.md
        run: node scripts/update-results.mjs

      - name: Commit changes
        if: ${{ secrets.FOOTBALL_DATA_API_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wedstrijden-data.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync match results"
          git push
